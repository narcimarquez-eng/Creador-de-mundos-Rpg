<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería de enemigos</title>
  <style>html,body{margin:0;height:100%;background:#0b1220;overflow:hidden}#info{position:fixed;left:8px;top:8px;color:#e2e8f0;font:14px system-ui;background:#0f172acc;padding:8px 10px;border-radius:8px}</style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/enemigos.js"></script>
  <script src="js/enemigos-optimizar.js"></script>
  <script src="js/enemigos-combate.js"></script>
</head>
<body>
<div id="info">cargando…</div>
<script>
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#1e293b');
  scene.add(new THREE.HemisphereLight(0xffffff, 0x334155, 1.0));
  const sol = new THREE.DirectionalLight(0xffffff, 1.2);
  sol.position.set(20, 40, 20); scene.add(sol);
  const suelo = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#334155' }));
  suelo.rotation.x = -Math.PI / 2; scene.add(suelo);
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 22, 120); camera.lookAt(0, 4, 0);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);

  const texturas = EnemyLib.createProceduralTextureSet(renderer.capabilities.getMaxAnisotropy());
  const ids = Object.keys(EnemyLib.ARCHETYPE_PRESETS);
  const t0 = performance.now();
  const resumen = [];
  ids.forEach((id, i) => {
    const base = EnemyLib.ARCHETYPE_PRESETS[id];
    const densidad = new URLSearchParams(location.search).get('densidad');
    const cfg = densidad ? Object.assign({}, base, { morphology: Object.assign({}, base.morphology, { meshDensity: densidad }) }) : base;
    const ta = performance.now();
    let rig = EnemyLib.buildProceduralEnemy(cfg, texturas, false, false);
    const tiempo = performance.now() - ta;
    const antesOpt = EnemyOpt.medirVisibles(rig);
    if (new URLSearchParams(location.search).get('opt') === '1') EnemyOpt.optimizarRig(rig);
    const despuesOpt = EnemyOpt.medirVisibles(rig);
    window.__opt = (window.__opt || []).concat([{ antes: antesOpt, despues: despuesOpt }]);
    const col = i % 8, fila = Math.floor(i / 8);
    rig.rootGroup.position.set(-70 + col * 20, 0, -40 + fila * 26);
    scene.add(rig.rootGroup);
    const vis = EnemyOpt.medirVisibles(rig);
    resumen.push({ id, tiempoMs: +tiempo.toFixed(1), mallas: vis.mallas, tris: vis.tris });
    rig.fx = EnemyFx.crear(rig, cfg);
    window.__rigs = (window.__rigs || []).concat([rig]);
  });
  const total = performance.now() - t0;
  window.__resumen = resumen;
  window.__total = total;
  let t = 0, ultimoDisparo = -10;
  const accionPrueba = new URLSearchParams(location.search).get('accion');
  window.__disparar = accion => (window.__rigs || []).forEach(rig => EnemyFx.disparar(rig.fx, accion, t));
  function animar() {
    requestAnimationFrame(animar);
    t += 0.016;
    if (accionPrueba && t - ultimoDisparo > 2) { ultimoDisparo = t; window.__disparar(accionPrueba); }
    (window.__rigs || []).forEach((rig, i) => {
      const estado = ['idle', 'walk', 'attack', 'hit', 'death'][i % 5];
      EnemyFx.actualizar(rig.fx, estado, t, 0.016, t);
    });
    controls.update();
    renderer.render(scene, camera);
  }
  animar();
  document.getElementById('info').textContent = `40 arquetipos construidos en ${total.toFixed(0)} ms`;
</script>
</body>
</html>
