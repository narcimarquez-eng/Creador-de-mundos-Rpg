<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Valdris · Tierras del Sol Quebrado</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #090d1a 55%, #020617 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .splash {
      width: min(520px, 92vw);
      padding: 28px 24px;
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), rgba(9, 13, 26, 0.98));
      border: 1px solid rgba(234, 179, 8, 0.65);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85), 0 0 36px rgba(234, 179, 8, 0.14);
      text-align: center;
    }
    .kicker {
      font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #facc15; margin-bottom: 8px; font-weight: 700;
    }
    h1 { margin: 0 0 10px; font-size: 26px; color: #f8fafc; }
    p { margin: 0 0 18px; font-size: 13.5px; color: #cbd5e1; line-height: 1.55; }
    .btn {
      display: inline-block; padding: 12px 24px; border-radius: 10px;
      background: linear-gradient(135deg, #ca8a04, #eab308);
      color: #0f172a; font-weight: 800; font-size: 15px; text-decoration: none;
      box-shadow: 0 6px 20px rgba(234, 179, 8, 0.35);
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="kicker">⚔️ Campaña Oficial · Juego Completo</div>
    <h1>Valdris · Tierras del Sol Quebrado</h1>
    <p>Iniciando el mundo cerrado de Valdris con sus 7 comarcas, 12 zonas de caza, 3 laberintos, 3 mazmorras y la crónica de 16 capítulos…</p>
    <a class="btn" href="visor-mundo.html?juego=valdris">Entrar en Valdris</a>
  </div>
  <script>
    (function () {
      var target = 'visor-mundo.html?juego=valdris';
      if (window.location.search && window.location.search.indexOf('noredir=1') === -1) {
        window.location.replace(target);
      } else if (!window.location.search) {
        window.location.replace(target);
      }
    })();
  </script>
</body>
</html>
